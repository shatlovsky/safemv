[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "safemv"
version = "0.1.0"
description = "Verified file copy and move for macOS and Linux"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Alexey Shatlovsky"}]
keywords = ["rsync", "copy", "move", "checksum", "verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.scripts]
safemv = "safemv:main"

[project.urls]
Homepage = "https://github.com/shatlovsky/safemv"
Issues = "https://github.com/shatlovsky/safemv/issues"

[tool.setuptools]
py-modules = ["safemv"]
